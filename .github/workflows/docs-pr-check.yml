name: Documentation PR checks

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact sync PR head SHA to validate (optional; defaults to this branch)"
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  docs-sync-approval:
    name: docs-sync-approval
    if: startsWith(github.event.pull_request.head.ref, 'docs-sync/') && github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require exact-head duckcatgnaf approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REVIEWS="$(gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" | jq 'add')" \
            python3 - "$HEAD_SHA" <<'PY'
          import json, os, sys
          head = sys.argv[1]
          reviews = json.loads(os.environ["REVIEWS"])
          exact_head_reviews = [r for r in reviews
                                if r.get("user", {}).get("login", "").lower() == "duckcatgnaf"
                                and r.get("commit_id") == head]
          latest = max(exact_head_reviews, key=lambda r: r.get("submitted_at", ""), default=None)
          if latest is None or latest.get("state") != "APPROVED":
              state = latest.get("state") if latest else "no review"
              raise SystemExit(f"Latest duckcatgnaf review on exact PR head {head}: {state}; APPROVED required")
          print(f"duckcatgnaf approved exact PR head {head}")
          PY
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.client_payload.sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Test sync PR validation
        run: python3 -m unittest discover -s tests -v
      - name: Validate wiki decisions for changed guides
        if: startsWith(github.event.pull_request.head.ref, 'docs-sync/') && github.event.pull_request.user.login == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The issue body is the human-maintained source of decisions. Sync
          # comments may contain regenerated unchecked checklists and must not
          # override completed decisions recorded in the body.
          gh issue view 61 --repo "$GH_REPO" --json body --jq .body > "$RUNNER_TEMP/issue-61-body.md"
          mapfile -t guides < <(gh pr diff "$PR_NUMBER" --repo "$GH_REPO" --name-only | awk -F/ '$1 == "docs" && $NF ~ /\.md$/ { name=$NF; sub(/\.md$/, "", name); print toupper(name) ".md" }' | sort -u)
          if [ "${#guides[@]}" -eq 0 ]; then
            echo "No changed Markdown guides found in this docs-sync PR; refusing to skip wiki decision validation." >&2
            exit 1
          fi
          python3 scripts/validate_wiki_decisions.py --issue-body "$RUNNER_TEMP/issue-61-body.md" --guides "${guides[@]}"
      - name: Check sync PR against its recorded upstream commit
        if: (startsWith(github.head_ref, 'docs-sync/') && github.event.pull_request.user.login == 'github-actions[bot]') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/docs-sync/'))
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .docs-sync-upstream-sha ]; then
            echo "Legacy sync branch has no recorded upstream SHA; drift validation is unavailable. Human review is required; this compatibility path does not authorize merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sha="$(cat .docs-sync-upstream-sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none --no-checkout https://github.com/catduckgnaf/print-handy.git "$RUNNER_TEMP/print-handy"
          git -C "$RUNNER_TEMP/print-handy" fetch --depth=1 origin "$sha"
          git -C "$RUNNER_TEMP/print-handy" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/print-handy" rev-parse HEAD)" = "$sha"
          PRINT_HANDY_DIR="$RUNNER_TEMP/print-handy" scripts/check-sync.sh
      - run: npm ci
      - run: npm run docs:build
