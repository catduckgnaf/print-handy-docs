name: Merge reviewed documentation sync

on:
  workflow_run:
    workflows: [Documentation PR checks]
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [edited]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read
  actions: write

concurrency:
  group: reviewed-docs-sync
  cancel-in-progress: false

jobs:
  merge:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'pull_request_review' || (github.event_name == 'issues' && github.event.issue.number == 61) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Merge only the reviewed and validated sync head
        shell: bash
        run: |
          set -euo pipefail
          prs="$(gh pr list --state open --limit 100 --json number,headRefName,headRefOid,isDraft,author --jq '[.[] | select((.headRefName | startswith("docs-sync/")) and .author.login == "github-actions[bot]" and .isDraft == false)]')"
          while IFS=$'\t' read -r number CHECKED_SHA; do
            [[ "$CHECKED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            if [ "$EVENT_NAME" = workflow_run ] && [ "$CHECKED_SHA" != "$EVENT_SHA" ]; then continue; fi
            if [ "$EVENT_NAME" = pull_request_review ] && [ "$number" != "$EVENT_PR" ]; then continue; fi
            export CHECKED_SHA
            # A late wiki decision may have made the prior PR build fail. Rerun
            # that exact PR run so its wiki and drift checks run again, rather
            # than replacing it with a dispatch that skips PR-specific checks.
            if [ "$EVENT_NAME" != workflow_run ]; then
              run_id="$(gh run list --workflow docs-pr-check.yml --event pull_request --limit 100 --json databaseId,headSha,status,conclusion --jq '[.[] | select(.headSha == env.CHECKED_SHA)] | first | select(.status == "completed" and .conclusion == "failure") | .databaseId')"
              if [ -n "$run_id" ]; then gh run rerun "$run_id" --failed; continue; fi
            fi
          # The exact-head gate and build must both have succeeded on this SHA.
          checks="$(gh api --paginate --slurp "repos/$GH_REPO/commits/$CHECKED_SHA/check-runs?per_page=100" | jq '[.[].check_runs[]]')"
          for name in 'Build documentation' 'docs-sync-approval'; do
            result="$(jq -r --arg n "$name" '[.[] | select(.name == $n)] | sort_by(.started_at) | last | if . then .conclusion // "pending" else "missing" end' <<<"$checks")"
            if [ "$result" != success ]; then
              echo "$name on $CHECKED_SHA is $result; no merge."
              continue 2
            fi
          done
          # Defend against a newer review that supersedes a previously passing check.
          reviews="$(gh api --paginate --slurp "repos/$GH_REPO/pulls/$number/reviews?per_page=100" | jq 'add')"
          result="$(jq -r --arg sha "$CHECKED_SHA" '[.[] | select((.user.login | ascii_downcase) == "duckcatgnaf" and .commit_id == $sha)] | sort_by(.submitted_at) | last | .state // "MISSING"' <<<"$reviews")"
          [ "$result" = APPROVED ] || { echo "Exact-head review is $result; no merge."; continue; }
          # Do not merge over unresolved conversations, even if rulesets do not enforce them.
          threads="$(gh api graphql --paginate -f query='query($owner:String!, $name:String!, $number:Int!, $endCursor:String) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { reviewThreads(first:100, after:$endCursor) { nodes { isResolved } pageInfo { hasNextPage endCursor } } } } }' -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -F number="$number")"
          if jq -se '[.[].data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length > 0' <<<"$threads" >/dev/null; then
            echo 'Unresolved review conversations; no merge.'
            continue
          fi
          gh issue view 61 --json body --jq .body > "$RUNNER_TEMP/wiki-decisions.md"
          mapfile -t guides < <(gh pr diff "$number" --name-only | awk -F/ '$1 == "docs" && $NF ~ /\.md$/ {name=$NF; sub(/\.md$/, "", name); print toupper(name) ".md"}' | sort -u)
          [ "${#guides[@]}" -gt 0 ] || { echo 'No guide changes to validate; refusing merge.' >&2; exit 1; }
          if ! python3 scripts/validate_wiki_decisions.py --issue-body "$RUNNER_TEMP/wiki-decisions.md" --guides "${guides[@]}"; then continue; fi
          # GitHub enforces rulesets and checks; the head match prevents racing a new push.
          gh pr merge "$number" --squash --match-head-commit "$CHECKED_SHA"
          # GITHUB_TOKEN merges do not trigger a push workflow. Explicitly dispatch
          # deployment from protected main instead, and fail visibly if dispatch fails.
          gh workflow run deploy-pages.yml --ref main
          done < <(jq -r '.[] | [.number, .headRefOid] | @tsv' <<<"$prs")
