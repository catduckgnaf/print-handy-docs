name: Docs sync check

# Daily safety net: if the site has drifted from the source of truth
# (catduckgnaf/print-handy/docs on main), dispatch Docs auto-sync, which
# merges and publishes the update itself.
# See README.md ("Keeping the site in sync") and scripts/check-sync.sh.

on:
  schedule:
    # Daily, 07:17 UTC
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: docs-sync-check
  cancel-in-progress: false

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this docs repo
        uses: actions/checkout@v4

      - name: Run sync check against upstream
        id: check
        run: |
          set +e
          scripts/check-sync.sh > drift-report.txt 2>&1
          status=$?
          set -e
          cat drift-report.txt
          {
            echo "## Docs sync check"
            echo ""
            echo '```'
            cat drift-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 1 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sync check itself failed (exit $status); see the log."
            exit "$status"
          fi

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.txt

      - name: Drift found, run Docs auto-sync to publish it
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Auto-sync merges and publishes on its own; if it cannot (new or
          # removed guide, failed build) it files the "Docs sync needed" issue.
          gh workflow run docs-auto-sync.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Drift found; dispatched Docs auto-sync." >> "$GITHUB_STEP_SUMMARY"
