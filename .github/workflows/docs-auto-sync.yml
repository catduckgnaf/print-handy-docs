name: Docs auto-sync

# The automated form of the manual sync in README.md ("How updates
# work"): regenerate the site copies from catduckgnaf/print-handy/docs
# at a given ref with scripts/sync-docs.py and open a PR with the diff.
# Merging that PR is what publishes — the Deploy workflow rebuilds the
# Pages site from main, never from a sync branch.
#
# Triggers:
# - workflow_dispatch: run by hand with an explicit ref (this is the
#   remedy the print-handy release surfaces gate points at).
# - repository_dispatch "print-handy-release": sent by print-handy's
#   post-release surfaces workflow when a release is published and the
#   DOCS_SYNC_TOKEN secret is configured there; client_payload.ref
#   carries the release tag.
#
# - schedule: sync upstream main daily as a fallback for missed dispatches.
# - repository_dispatch "print-handy-main": ignore payload refs and sync main.
#
# The published site always tracks upstream main, including release triggers.
# Existing moving-ref sync PR branches
# are updated with fast-forward pushes; other runs use unique branches. If the site matches the ref,
# the run ends as a clean no-op with no PR.
#
# This does not replace the Docs sync check or its "Docs sync needed"
# issue: sync PRs require per-guide decisions for their exact head (see README.md).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Published source is main; non-main manual refs are rejected"
        type: string
        required: false
        default: ""
  repository_dispatch:
    types: [print-handy-release, print-handy-main]
  schedule:
    - cron: '47 7 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: docs-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_REF: ${{ inputs.ref }}
      PAYLOAD_REF: ${{ github.event.client_payload.ref }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout this docs repo
        uses: actions/checkout@v4

      - name: Resolve the upstream ref
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ -n "$INPUT_REF" ] && [ "$INPUT_REF" != main ]; then
            echo 'Only upstream main can be published to the main-tracking site.' >&2
            exit 1
          fi
          # A release payload names a tag, but the public site tracks main.
          # Ignore payload refs rather than allowing an old release to roll back docs.
          ref=main
          [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "Ref contains unexpected characters: $ref" >&2
            exit 1
          }
          slug="$(printf '%s' "$ref" | tr '/' '-')"
          {
            echo "ref=$ref"
            echo "branch=docs-sync/$slug-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          set +e
          existing_branch="$(python3 scripts/has-sync-pr.py --branch "$ref")"
          status=$?
          set -e
          [ "$status" -eq 0 ] || [ "$status" -eq 1 ] || exit "$status"
          echo "existing_branch=$existing_branch" >> "$GITHUB_OUTPUT"
          echo "Syncing docs from catduckgnaf/print-handy@$ref"

      - name: Checkout upstream Print Handy at the ref
        run: |
          set -euo pipefail
          # Outside the workspace, so the upstream tree can never leak
          # into the sync branch or the changed-file detection below.
          git clone --depth 1 https://github.com/catduckgnaf/print-handy.git "$RUNNER_TEMP/print-handy-upstream"
          git -C "$RUNNER_TEMP/print-handy-upstream" fetch --depth 1 origin "${{ steps.ref.outputs.ref }}"
          git -C "$RUNNER_TEMP/print-handy-upstream" checkout --quiet FETCH_HEAD

      - name: Apply the sync
        id: sync
        env:
          EXISTING_BRANCH: ${{ steps.ref.outputs.existing_branch }}
        run: |
          set -euo pipefail
          existing_branch="${EXISTING_BRANCH:-}"
          if [ -n "$existing_branch" ]; then
            [[ "$existing_branch" =~ ^docs-sync/[A-Za-z0-9._/-]+$ ]] || { echo "Unsafe sync branch: $existing_branch" >&2; exit 1; }
            git fetch origin "$existing_branch"
            git switch -C "$existing_branch" FETCH_HEAD
          else
            git switch -C "${{ steps.ref.outputs.branch }}"
          fi
          set +e
          python3 scripts/sync-docs.py --upstream "$RUNNER_TEMP/print-handy-upstream" 2>&1 | tee "$RUNNER_TEMP/sync-report.txt"
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          if [ "${statuses[1]}" -ne 0 ]; then
            status=${statuses[1]}
          fi
          set -e
          {
            echo "## Docs auto-sync — print-handy@${{ steps.ref.outputs.ref }}"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "Sync stopped; review the report above before publishing." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift at this ref — clean no-op, no PR opened." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the sync (drift check + site build)
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          PRINT_HANDY_DIR="$RUNNER_TEMP/print-handy-upstream" scripts/check-sync.sh
          npm ci
          npm run docs:build

      - name: Commit, push and open the sync PR
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_REF: ${{ steps.ref.outputs.ref }}
          NEW_BRANCH: ${{ steps.ref.outputs.branch }}
          EXISTING_BRANCH: ${{ steps.ref.outputs.existing_branch }}
        run: |
          set -euo pipefail
          ref="$SYNC_REF"
          branch="${EXISTING_BRANCH:-}"
          [ -n "$branch" ] || branch="$NEW_BRANCH"
          [[ "$branch" =~ ^docs-sync/[A-Za-z0-9._/-]+$ ]] || { echo "Unsafe sync branch: $branch" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/print-handy-upstream" rev-parse HEAD > .docs-sync-upstream-sha
          git add -A
          git commit -m "Sync docs from print-handy $ref (auto-sync)"
          git push origin HEAD:"$branch"
          sync_sha="$(git rev-parse HEAD)"
          gh workflow run docs-pr-check.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
            -f "sha=$sync_sha"
          {
            python3 scripts/has-sync-pr.py --marker "$ref"
            echo "Automated docs sync from [catduckgnaf/print-handy@$ref](https://github.com/catduckgnaf/print-handy/tree/$ref) — the source of truth — produced by \`scripts/sync-docs.py\` (workflow: Docs auto-sync)."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt"
            echo '```'
            echo ""
            echo "Verified before opening: \`scripts/check-sync.sh\` reports NO DRIFT against that ref and \`npm run docs:build\` passes."
            echo ""
            echo "Notes for the reviewer:"
            echo "- New or removed guides stop the sync before any file changes and require manual review."
            echo "- Review the wiki for each changed guide and record exactly one checked decision below. A new sync head requires a fresh assessment."
            echo ""
            echo "<!-- wiki-assessment-head: $sync_sha -->"
            changed_paths="$(git diff --name-only origin/main...HEAD)"
            mapped_guides="$(printf '%s\n' "$changed_paths" | python3 scripts/map_sync_guides.py scripts/sync-manifest.tsv)"
            [ -n "$mapped_guides" ] || { echo 'No mapped guides to assess' >&2; exit 1; }
            while IFS= read -r guide; do
              printf -- '- [ ] `%s` — wiki decision: `wiki-updated` — <wiki page URL or revision> OR `wiki-not-needed`\n' "$guide"
            done <<< "$mapped_guides"
            echo "- The reviewed sync workflow merges only after the exact head passes build, approval and wiki checks, then dispatches Pages."
          } > pr-body.md
          if [ -n "$EXISTING_BRANCH" ]; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" --body-file pr-body.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" \
              --title "Docs sync: print-handy@$ref" --body-file pr-body.md
          fi
