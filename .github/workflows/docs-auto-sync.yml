name: Docs auto-sync

# The automated form of the manual sync in README.md ("How updates
# work"): regenerate the site copies from catduckgnaf/print-handy/docs
# with scripts/sync-docs.py, verify it (drift check + site build), then open
# a PR, merge it and dispatch the Pages deploy in the same run. No human
# approval is needed. A new or removed guide, or a failed build, stops the
# run and files a "Docs sync needed" issue instead.
#
# Triggers:
# - workflow_dispatch: run by hand with an explicit ref (this is the
#   remedy the print-handy release surfaces gate points at).
# - repository_dispatch "print-handy-release": sent by print-handy's
#   post-release surfaces workflow when a release is published and the
#   DOCS_SYNC_TOKEN secret is configured there; client_payload.ref
#   carries the release tag.
#
# - schedule: sync upstream main daily as a fallback for missed dispatches.
# - repository_dispatch "print-handy-main": ignore payload refs and sync main.
#
# The published site always tracks upstream main, including release triggers.
# Each run builds a fresh branch from main; older open sync PRs are closed
# once main matches upstream. If the site already matches, the run is a
# clean no-op with no PR.
#
# The wiki check is informational: changed guides are listed on a
# wiki-check issue after publishing. It never blocks the sync.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Published source is main; non-main manual refs are rejected"
        type: string
        required: false
        default: ""
  repository_dispatch:
    types: [print-handy-release, print-handy-main]
  schedule:
    - cron: '47 7 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: docs-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_REF: ${{ inputs.ref }}
      PAYLOAD_REF: ${{ github.event.client_payload.ref }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout this docs repo
        uses: actions/checkout@v4
        with:
          # Existing sync branches may have diverged before main's tip.
          fetch-depth: 0

      - name: Resolve the upstream ref
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ -n "$INPUT_REF" ] && [ "$INPUT_REF" != main ]; then
            echo 'Only upstream main can be published to the main-tracking site.' >&2
            exit 1
          fi
          # A release payload names a tag, but the public site tracks main.
          # Ignore payload refs rather than allowing an old release to roll back docs.
          ref=main
          [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "Ref contains unexpected characters: $ref" >&2
            exit 1
          }
          slug="$(printf '%s' "$ref" | tr '/' '-')"
          {
            echo "ref=$ref"
            echo "branch=docs-sync/$slug-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          echo "Syncing docs from catduckgnaf/print-handy@$ref"

      - name: Checkout upstream Print Handy at the ref
        run: |
          set -euo pipefail
          # Outside the workspace, so the upstream tree can never leak
          # into the sync branch or the changed-file detection below.
          git clone --depth 1 https://github.com/catduckgnaf/print-handy.git "$RUNNER_TEMP/print-handy-upstream"
          git -C "$RUNNER_TEMP/print-handy-upstream" fetch --depth 1 origin "${{ steps.ref.outputs.ref }}"
          git -C "$RUNNER_TEMP/print-handy-upstream" checkout --quiet FETCH_HEAD

      - name: Apply the sync
        id: sync
        run: |
          set -euo pipefail
          # Always start from main: a reused branch could already hold the
          # sync (no diff, never merged) or be stale against main.
          git switch -C "${{ steps.ref.outputs.branch }}" origin/main
          set +e
          python3 scripts/sync-docs.py --upstream "$RUNNER_TEMP/print-handy-upstream" 2>&1 | tee "$RUNNER_TEMP/sync-report.txt"
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          if [ "${statuses[1]}" -ne 0 ]; then
            status=${statuses[1]}
          fi
          set -e
          {
            echo "## Docs auto-sync — print-handy@${{ steps.ref.outputs.ref }}"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "Sync stopped; review the report above before publishing." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift at this ref — clean no-op, no PR opened." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the sync (drift check + site build)
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          PRINT_HANDY_DIR="$RUNNER_TEMP/print-handy-upstream" scripts/check-sync.sh
          npm ci
          npm run docs:build

      - name: Commit, open, merge and publish the sync
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_REF: ${{ steps.ref.outputs.ref }}
          NEW_BRANCH: ${{ steps.ref.outputs.branch }}
        run: |
          set -euo pipefail
          ref="$SYNC_REF"
          branch="$NEW_BRANCH"
          [[ "$branch" =~ ^docs-sync/[A-Za-z0-9._/-]+$ ]] || { echo "Unsafe sync branch: $branch" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/print-handy-upstream" rev-parse HEAD > .docs-sync-upstream-sha
          git add -A
          git commit -m "Sync docs from print-handy $ref (auto-sync)"
          git push origin HEAD:"$branch"
          sync_sha="$(git rev-parse HEAD)"
          changed_paths="$(git diff --name-only origin/main...HEAD)"
          mapped_guides="$(printf '%s\n' "$changed_paths" | python3 scripts/map_sync_guides.py scripts/sync-manifest.tsv || true)"
          {
            python3 scripts/has-sync-pr.py --marker "$ref"
            echo "Automated docs sync from [catduckgnaf/print-handy@$ref](https://github.com/catduckgnaf/print-handy/tree/$ref), the source of truth, produced by \`scripts/sync-docs.py\` (workflow: Docs auto-sync)."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt"
            echo '```'
            echo ""
            echo "Verified in the same run before merging: \`scripts/check-sync.sh\` reports no drift and \`npm run docs:build\` passes. This PR merges itself and publishes the site."
          } > pr-body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --title "Docs sync: print-handy@$ref" --body-file pr-body.md
          # Already verified above (drift check + site build) on this exact commit.
          gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$sync_sha"
          # GITHUB_TOKEN merges do not fire push workflows; dispatch the deploy explicitly.
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Merged and dispatched Pages deploy." >> "$GITHUB_STEP_SUMMARY"
          # Wiki check: informational only, never blocks publishing.
          if [ -n "$mapped_guides" ]; then
            pr_url="$(gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
            {
              echo "Docs were published from print-handy@$ref ($pr_url). Check whether the [wiki](https://github.com/catduckgnaf/print-handy/wiki) needs a matching update for:"
              echo ""
              printf '%s\n' "$mapped_guides" | sed '/^$/d; s/.*/- [ ] `&`/'
            } > wiki-body.md
            wiki_issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label wiki-check --json number --jq '.[0].number // empty' 2>/dev/null || true)"
            if [ -n "$wiki_issue" ]; then
              gh issue comment "$wiki_issue" --repo "$GITHUB_REPOSITORY" --body-file wiki-body.md
            else
              gh label create wiki-check --repo "$GITHUB_REPOSITORY" --color c5def5 --description "Wiki may need an update after a docs sync" 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Wiki check after docs sync" --label wiki-check --body-file wiki-body.md
            fi
          fi

      - name: Close superseded sync PRs and "Docs sync needed"
        if: success()
        run: |
          set -euo pipefail
          # main now matches upstream, so any other open bot sync PR is obsolete.
          for n in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName,author --jq '.[] | select((.headRefName | startswith("docs-sync/")) and .author.login == "app/github-actions") | .number'); do
            gh pr close "$n" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "Superseded: Docs auto-sync run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID brought main up to date with print-handy@main."
          done
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Docs sync needed"' --json number,title --jq '.[] | select(.title == "Docs sync needed") | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Resolved by Docs auto-sync run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID: the site now matches print-handy@main and has been published."
          done

      - name: Flag a sync that needs a human
        if: failure()
        run: |
          set -euo pipefail
          body="Docs auto-sync could not publish automatically: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (usually a new or removed guide that needs a manifest entry, or a build failure)."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Docs sync needed"' --json number,title --jq '.[] | select(.title == "Docs sync needed") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Docs sync needed" --body "$body"
          fi
